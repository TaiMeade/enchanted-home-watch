<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C2733" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cascade layer order: Tailwind theme/base, then Vuetify, then Tailwind utilities.
         Declared first so every later stylesheet slots into this order. -->
    <style>
      @layer theme, base, vuetify-core, vuetify-components, vuetify-overrides, vuetify-utilities, components, utilities, vuetify-final;
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
